name = "byty-brno"
main = "src/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "byty-brno"
database_id = "DOPLNIT_PO_VYTVORENI_DB"

# kontrola nových inzerátů každých 20 minut
[triggers]
crons = ["*/20 * * * *"]

[vars]
# Domov pro seniory Mikuláškovo nám. 706/20, Starý Lískovec
HOME_LAT = "49.17165"
HOME_LON = "16.56547"
# notifikace: téma v aplikaci ntfy (vymysli si unikátní název, např. byty-teta-x7k2)
NTFY_TOPIC = ""
# co je "zajímavé" pro notifikaci
NOTIFY_MAX_PRICE = "20000"
NOTIFY_MAX_KM = "4"
